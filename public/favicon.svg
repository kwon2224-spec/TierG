<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Luxury Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141d30" />
      <stop offset="100%" stop-color="#05080f" />
    </radialGradient>
    
    <!-- Neon Golf Green / Emerald Gradient for the Tee -->
    <linearGradient id="teeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- 3D Silver-White Golf Ball Gradient -->
    <radialGradient id="ballGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="95%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Glowing effect shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card rounded background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" />

  <!-- Inner Subtle Glow Ring -->
  <rect x="14" y="12" width="484" height="488" rx="106" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.35" filter="url(#glow)" />

  <g transform="translate(0, 30)">
    <!-- 1. The stylized letter 'T' formed as a GOLF TEE -->
    <!-- Vertical Tee stem (Tapering down to a sharp wooden/plastic point) -->
    <path d="M 234 235 L 278 235 L 264 425 Q 256 445 248 425 Z" fill="url(#teeGrad)" filter="url(#glow)" />
    
    <!-- Horizontal Tee top cup (Curving elegantly upwards like a T-bar) -->
    <path d="M 125 200 Q 256 165 387 200 Q 387 235 350 235 Q 256 240 162 235 Q 125 235 125 200 Z" fill="url(#teeGrad)" filter="url(#glow)" />
    
    <!-- Cup Inner Depth shadow/contrast strip -->
    <path d="M 148 206 Q 256 182 364 206 Q 340 222 256 225 Q 172 222 148 206 Z" fill="#047857" opacity="0.7" />
    
    <!-- 2. The 3D GOLF BALL resting perfectly on top of the T-bar -->
    <circle cx="256" cy="125" r="92" fill="url(#ballGrad)" />
    
    <!-- Detailed Semi-transparent dimple dimple pattern for absolute gold authenticity -->
    <!-- Dimples Line 1 -->
    <circle cx="216" cy="75" r="5" fill="#64748b" opacity="0.22" />
    <circle cx="256" cy="68" r="6" fill="#64748b" opacity="0.28" />
    <circle cx="296" cy="75" r="5" fill="#64748b" opacity="0.22" />
    
    <!-- Dimples Line 2 -->
    <circle cx="190" cy="115" r="6" fill="#64748b" opacity="0.22" />
    <circle cx="228" cy="110" r="6.5" fill="#64748b" opacity="0.28" />
    <circle cx="284" cy="110" r="6.5" fill="#64748b" opacity="0.28" />
    <circle cx="322" cy="115" r="6" fill="#64748b" opacity="0.22" />
    
    <!-- Dimples Line 3 -->
    <circle cx="210" cy="155" r="6.5" fill="#475569" opacity="0.25" />
    <circle cx="256" cy="162" r="7.5" fill="#475569" opacity="0.32" />
    <circle cx="302" cy="155" r="6.5" fill="#475569" opacity="0.25" />
    
    <!-- Dimples Outer Margins -->
    <circle cx="172" cy="140" r="5.5" fill="#94a3b8" opacity="0.2" />
    <circle cx="340" cy="140" r="5.5" fill="#64748b" opacity="0.2" />
    <circle cx="256" cy="100" r="6.5" fill="#64748b" opacity="0.22" />
  </g>

  <!-- Title Text - TIER GOLF (White Sporty typography) -->
  <text x="256" y="472" font-family="'Pretendard', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="5" text-anchor="middle">
    TIER GOLF
  </text>
</svg>